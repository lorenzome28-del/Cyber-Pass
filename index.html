<!DOCTYPE html>
<html lang="it">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPass - Password Generator</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #0083B0;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #050B14 0%, #0052D4 40%, #4364F7 70%, #6FB1FC 100%);
            z-index: -1;
            transition: all 0.5s ease;
        }

        .app-bg-alt {
            background: linear-gradient(135deg, #00B4DB 0%, #0083B0 50%, #0A364C 100%) !important;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            #app {
                border-radius: 32px;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.2px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 25px 25px rgba(0, 0, 0, 0.25);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.25) !important;
            border: none !important;
            color: #fff !important;
            border-radius: 22px !important;
            padding: 16px 20px !important;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        select.glass-input option {
            background-color: #13364C !important;
            color: #ffffff !important;
            font-size: 15px;
            padding: 10px;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .cursor-pointer { cursor: pointer; }

        #auth-screen {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            overflow-y: auto;
        }

        .auth-card {
            padding: 28px;
            border-radius: 32px;
        }

        .btn-primary {
            background: #ffffff;
            color: #0052D4;
            border: none;
            border-radius: 22px;
            height: 55px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.2s;
            width: 100%;
        }

        .btn-primary:active { transform: scale(0.98); }

        #generator-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0, 82, 212, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pass-option-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .pass-option-card:hover {
            border-color: rgba(0, 229, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
        }

        .pass-text {
            font-size: 15px;
            font-weight: bold;
            color: #00E5FF;
            letter-spacing: 0.5px;
            word-break: break-all;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00E5FF;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tick-icon {
            font-size: 60px;
            color: #00E5FF;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .snackbar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #13364C;
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
            transition: 0.3s;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div class="app-background" id="main-bg"></div>

    <div id="app">
        <!-- SCHERMATA AUTENTICAZIONE -->
        <div id="auth-screen">
            <div class="glass-container auth-card">
                <h1 style="text-align: center; font-size: 32px; font-weight: 900; letter-spacing: 2px; margin-bottom: 25px;">CyberPass</h1>
                <h2 id="auth-title" style="font-size: 26px; font-weight: bold; margin-bottom: 6px;">Bentornato!</h2>
                <p id="auth-subtitle" style="font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 20px;">Accedi per generare le tue password sicure.</p>
                
                <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 15px;">
                    <div style="position: relative;">
                        <span class="material-icons-outlined" style="position: absolute; left: 16px; top: 16px; color: #00E5FF;">email</span>
                        <input type="email" id="auth-email" class="glass-input" placeholder="Indirizzo Email" style="padding-left: 50px !important;">
                    </div>
                    <div style="position: relative;">
                        <span class="material-icons-outlined" style="position: absolute; left: 16px; top: 16px; color: #00E5FF;">lock</span>
                        <input type="password" id="auth-password" class="glass-input" placeholder="Password" style="padding-left: 50px !important;">
                    </div>
                </div>

                <div class="flex justify-between items-center" style="margin-bottom: 15px;">
                    <div class="flex items-center" style="gap: 6px;">
                        <input type="checkbox" id="remember-me" checked style="accent-color: #00E5FF; width: 18px; height: 18px;">
                        <span style="font-size: 13px;">Rimani connesso</span>
                    </div>
                </div>

                <button class="btn-primary" id="auth-submit-btn" onclick="handleAuth()">Accedi</button>

                <div style="text-align: center; margin-top: 18px; font-size: 13px;">
                    <span id="auth-toggle-text" style="color: rgba(255,255,255,0.7);">Non hai un account? </span>
                    <span id="auth-toggle-btn" onclick="toggleAuthMode()" style="color: #00E5FF; font-weight: bold; text-decoration: underline; cursor: pointer;">Registrati</span>
                </div>
            </div>
        </div>

        <!-- SCHERMATA GENERATORE PASSWORD -->
        <div id="generator-screen" class="hidden">
            <header>
                <div class="flex items-center" style="gap: 8px;">
                    <span style="font-weight: 900; letter-spacing: 2px; color: #00E5FF; font-size: 22px;">CyberPass</span>
                </div>
                <div class="flex" style="gap: 4px;">
                    <span class="material-icons-outlined cursor-pointer" onclick="logout()" title="Logout" style="padding: 8px;">logout</span>
                </div>
            </header>

            <div class="content-body">
                <div class="glass-container" style="padding: 20px;">
                    <h3 style="font-size: 16px; margin-bottom: 14px; color: #00E5FF;">Parametri Password</h3>
                    
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label style="font-size: 12px; color: rgba(255,255,255,0.8); display: block; margin-bottom: 4px;">1 Parola (minimo 5 lettere):</label>
                            <input type="text" id="input-word" class="glass-input" placeholder="es. gattino" style="padding: 12px 16px !important;">
                        </div>

                        <div>
                            <label style="font-size: 12px; color: rgba(255,255,255,0.8); display: block; margin-bottom: 4px;">1 Numero (3 o 4 cifre):</label>
                            <input type="number" id="input-number" class="glass-input" placeholder="es. 482 o 9154" style="padding: 12px 16px !important;">
                        </div>

                        <div>
                            <label style="font-size: 12px; color: rgba(255,255,255,0.8); display: block; margin-bottom: 4px;">Carattere speciale:</label>
                            <select id="input-special" class="glass-input" style="padding: 12px 16px !important;">
                                <option value="" disabled selected>Seleziona un simbolo</option>
                                <option value="\">\</option>
                                <option value="/">/</option>
                                <option value="*">*</option>
                                <option value="-">-</option>
                                <option value="+">+</option>
                                <option value="_">_</option>
                                <option value="#">#</option>
                                <option value="@">@</option>
                                <option value="€">€</option>
                                <option value="&">&amp;</option>
                                <option value="%">%</option>
                                <option value="$">$</option>
                            </select>
                        </div>

                        <button class="btn-primary" onclick="generatePasswords()" style="height: 48px; margin-top: 6px; background: #00E5FF; color: #000;">Genera 6 Opzioni Password</button>
                    </div>
                </div>

                <!-- Box Risultati con 6 Opzioni -->
                <div id="results-section" class="hidden">
                    <h4 style="font-size: 14px; margin-bottom: 8px; color: rgba(255,255,255,0.9);">Scegli la password che preferisci:</h4>
                    <div id="options-container"></div>
                </div>
            </div>
        </div>

        <!-- MODALE DI CARICAMENTO -->
        <div id="loading-modal" class="modal-overlay hidden">
            <div id="spinner-element" class="loader"></div>
            <span id="tick-element" class="material-icons tick-icon hidden">check_circle</span>
            <p id="loading-text" style="margin-top: 15px; font-size: 14px; font-weight: bold; color: #fff;">Autenticazione in corso...</p>
        </div>
    </div>

    <div id="snackbar" class="snackbar hidden">Messaggio notifica</div>

    <script>
        let isLoginMode = true;
        let currentUser = null;
        let usersDB = {};

        window.onload = function() {
            loadUsersDB();
            checkSavedLogin();
            setupEnterKeyListeners();
        };

        function clearAuthInputs() {
            document.getElementById('auth-email').value = '';
            document.getElementById('auth-password').value = '';
        }

        function setupEnterKeyListeners() {
            const emailInput = document.getElementById('auth-email');
            const passwordInput = document.getElementById('auth-password');

            const triggerAuthOnEnter = function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    handleAuth();
                }
            };

            emailInput.addEventListener('keydown', triggerAuthOnEnter);
            passwordInput.addEventListener('keydown', triggerAuthOnEnter);
        }

        function showSnackBar(msg) {
            const sb = document.getElementById('snackbar');
            sb.innerText = msg;
            sb.classList.remove('hidden');
            setTimeout(() => sb.classList.add('hidden'), 2000);
        }

        function loadUsersDB() {
            const db = localStorage.getItem('app_users_cyberpass');
            usersDB = db ? JSON.parse(db) : {};
        }

        function saveUsersDB() {
            localStorage.setItem('app_users_cyberpass', JSON.stringify(usersDB));
        }

        function checkSavedLogin() {
            const savedUser = localStorage.getItem('active_session_cyberpass_user');
            const isLoggedIn = localStorage.getItem('isLoggedIn_cyberpass') === 'true';
            if (isLoggedIn && savedUser && usersDB[savedUser]) {
                currentUser = savedUser;
                showGeneratorScreen();
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            clearAuthInputs();

            document.getElementById('auth-title').innerText = isLoginMode ? 'Bentornato!' : 'Crea Account';
            document.getElementById('auth-subtitle').innerText = isLoginMode ? 'Accedi per generare le tue password sicure.' : 'Registrati per iniziare a creare password sicure.';
            document.getElementById('auth-submit-btn').innerText = isLoginMode ? 'Accedi' : 'Registrati';
            document.getElementById('auth-toggle-text').innerText = isLoginMode ? 'Non hai un account? ' : 'Hai già un account? ';
            document.getElementById('auth-toggle-btn').innerText = isLoginMode ? 'Registrati' : 'Accedi';
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;

            if (!email || !email.includes('@')) {
                showSnackBar('Inserisci un indirizzo email valido!');
                return;
            }
            if (password.length < 4) {
                showSnackBar('La password principale deve contenere almeno 4 caratteri!');
                return;
            }

            if (isLoginMode) {
                if (!usersDB[email]) {
                    showSnackBar('Nessun account trovato. Registrati prima!');
                    return;
                }
                if (usersDB[email] === password) {
                    startAccessAnimation(() => {
                        currentUser = email;
                        localStorage.setItem('active_session_cyberpass_user', email);
                        localStorage.setItem('isLoggedIn_cyberpass', rememberMe);
                        showGeneratorScreen();
                        clearAuthInputs();
                    });
                } else {
                    showSnackBar('Password errata!');
                }
            } else {
                if (usersDB[email]) {
                    showSnackBar('Account già esistente! Effettua il Login.');
                    return;
                }
                usersDB[email] = password;
                saveUsersDB();

                startAccessAnimation(() => {
                    currentUser = email;
                    localStorage.setItem('active_session_cyberpass_user', email);
                    localStorage.setItem('isLoggedIn_cyberpass', rememberMe);
                    showGeneratorScreen();
                    clearAuthInputs();
                    showSnackBar('Registrazione completata!');
                });
            }
        }

        function startAccessAnimation(onComplete) {
            const modal = document.getElementById('loading-modal');
            const spinner = document.getElementById('spinner-element');
            const tick = document.getElementById('tick-element');
            const text = document.getElementById('loading-text');

            modal.classList.remove('hidden');
            spinner.classList.remove('hidden');
            tick.classList.add('hidden');
            text.innerText = isLoginMode ? 'Autenticazione in corso...' : 'Creazione account...';

            setTimeout(() => {
                spinner.classList.add('hidden');
                tick.classList.remove('hidden');
                text.innerText = 'Accesso effettuato!';

                setTimeout(() => {
                    modal.classList.add('hidden');
                    onComplete();
                }, 800);
            }, 1500);
        }

        function logout() {
            localStorage.setItem('isLoggedIn_cyberpass', 'false');
            currentUser = null;
            clearAuthInputs();
            document.getElementById('generator-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('main-bg').className = 'app-background';
        }

        function showGeneratorScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('generator-screen').classList.remove('hidden');
            document.getElementById('main-bg').className = 'app-background app-bg-alt';
        }

        function generatePasswords() {
            const wordInput = document.getElementById('input-word').value.trim();
            const numberInput = document.getElementById('input-number').value.trim();
            const specialChar = document.getElementById('input-special').value;

            const lettersOnly = wordInput.replace(/[^a-zA-Z]/g, '');
            if (lettersOnly.length < 5) {
                showSnackBar('La parola deve contenere obbligatoriamente più di 4 lettere (almeno 5).');
                return;
            }

            if (!/^\d{3,4}$/.test(numberInput)) {
                showSnackBar('Il numero deve essere composto esattamente da 3 o 4 cifre.');
                return;
            }

            if (!specialChar) {
                showSnackBar('Seleziona un carattere speciale.');
                return;
            }

            let wordCap = wordInput.charAt(0).toUpperCase() + wordInput.slice(1).toLowerCase();
            let wordLower = wordInput.toLowerCase();
            let wordUpper = wordInput.toUpperCase();

            // Creazione di 6 opzioni differenti
            let options = [
                wordCap + numberInput + specialChar,
                specialChar + wordCap + numberInput,
                wordLower + specialChar + numberInput,
                wordUpper + specialChar + numberInput,
                wordCap + specialChar + numberInput,
                specialChar + wordLower + numberInput + specialChar
            ];

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            options.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'pass-option-card';
                card.innerHTML = `
                    <div>
                        <div style="font-size: 10px; color: rgba(255,255,255,0.6); margin-bottom: 2px;">Opzione ${idx + 1}</div>
                        <div class="pass-text">${p}</div>
                    </div>
                    <button onclick="copyPassword('${p}')" style="background: rgba(0, 229, 255, 0.2); border: 1px solid #00E5FF; color: #00E5FF; padding: 6px 12px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 12px;">Copia</button>
                `;
                container.appendChild(card);
            });

            document.getElementById('results-section').classList.remove('hidden');
            showSnackBar('6 opzioni generate con successo!');
        }

        function copyPassword(pass) {
            navigator.clipboard.writeText(pass);
            showSnackBar('Password copiata negli appunti!');
        }
    </script>
</body>
</html>
